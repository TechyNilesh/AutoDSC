[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "stream_clustering"
version = "0.1.0"
description = "Fast Stream Clustering implementation in Rust"
authors = [{name = "Anonymous", email = "anonymous@anonymous.com"}]
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0",
]

[tool.maturin]
features = ["pyo3/extension-module"]
